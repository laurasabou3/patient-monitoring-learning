apiVersion: apps/v1
kind: Deployment

metadata:
  name: patient-api

spec:
  replicas: {{ .Values.api.replicas }}

  selector:
    matchLabels:
      app: patient-api

  template:
    metadata:
      labels:
        app: patient-api

    spec:
      containers:
      - name: patient-api
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"

        ports:
        - containerPort: {{ .Values.api.containerPort }}