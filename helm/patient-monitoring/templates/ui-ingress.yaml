{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: patient-ui-ingress

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
  - http:
      paths:
      - path: /
        pathType: {{ .Values.ingress.pathType }}

        backend:
          service:
            name: patient-ui-service

            port:
              number: 80

{{- end }}