services:
  api:
    image: patient-api
    container_name: api
    ports:
      - "8000:8000"
    volumes:
      - C:\DockerLearning\PatientMonitoring\api:/app
    networks:
      - patient-net

  ui:
    image: nginx
    container_name: ui
    ports:
      - "8080:80"
    volumes:
      - C:\DockerLearning\PatientMonitoring\ui\index.html:/usr/share/nginx/html/index.html
      - C:\DockerLearning\PatientMonitoring\ui\nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - patient-net
    depends_on:
      - api

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password123!"
    ports:
      - "1433:1433"
    networks:
      - patient-net

networks:
  patient-net: